const STORE = 'ezhire-2026-redesign-key-d835d8890526';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)));
}
async function show(html) {
  if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
  document.open(); document.write(html); document.close();
}
async function derive(user, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iterations, hash: 'SHA-256' }, base, 256));
}
const form = document.getElementById('login');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  document.getElementById('error').textContent = '';
  try {
    const raw = await derive(form.user.value, form.password.value);
    const html = await decrypt(raw);
    try { sessionStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch {}
    await show(html);
  } catch {
    document.getElementById('error').textContent = 'Username หรือ password ไม่ถูกต้อง';
    button.disabled = false;
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch {}
  if (saved) { try { return await show(await decrypt(bytes(saved))); } catch { try { sessionStorage.removeItem(STORE); } catch {} } }

  form.user.focus();
})();
