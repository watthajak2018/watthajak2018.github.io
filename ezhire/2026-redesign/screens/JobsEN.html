    const html = await decrypt(raw);
    try { sessionStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch {}
    await show(html);
  } catch {
    document.getElementById('error').textContent = 'Username หรือ password ไม่ถูกต้อง';
    button.disabled = false;
  }
});
(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch {}
  if (saved) { try { return await show(await decrypt(bytes(saved))); } catch { try { sessionStorage.removeItem(STORE); } catch {} } }
  form.hidden = false;
  form.user.focus();
})();
</script>
