const STORE = 'ezhire-2026-redesign-key-d835d8890526';
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct)));

async function show(html) {

}
async function derive(user, password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + password), 'PBKDF2', false, ['deriveBits']);

  document.getElementById('error').textContent = '';
  try {
    const raw = await derive(form.user.value, form.password.value);
    const html = await decrypt(raw);
    try { sessionStorage.setItem(STORE, btoa(String.fromCharCode(...raw))); } catch {}

});
(async () => {

  form.user.focus();
})();
